# cargo-deny configuration: licences, advisories, bans and sources.
# Policy: only permissive or weak-copyleft licences that allow private and
# commercial use without fees. No AGPL, GPL, SSPL or non-commercial licences.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained crates pulled in only by the gate G0 benchmark
# (crates/altais-crdt-bench, not shipped). Not vulnerabilities, but a
# supply-chain risk recorded in docs/benchmarks/crdt-g0.md; to be resolved
# before a CRDT crate becomes a dependency of the app.
ignore = [
    { id = "RUSTSEC-2026-0248", reason = "im: via loro-internal; G0 benchmark only" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps: via im (loro); G0 benchmark only" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks: via im (loro); G0 benchmark only" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill: via postcard/heapless (loro); G0 benchmark only" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr: via yrs; G0 benchmark only" },
    # Desktop app (apps/desktop/src-tauri) on Linux only: Tauri's GTK 3
    # bindings use this build-time macro crate. Not part of the Windows build.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: via glib-macros (Tauri on Linux); build-time only" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
