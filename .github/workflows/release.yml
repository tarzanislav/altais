name: Release

# Builds the Windows installer and publishes it as a pre-release with its
# SHA-256 checksum. Start it either by pushing a tag v<version> (matching the
# app's version), or with "Run workflow" on GitHub (Actions → Release): that
# releases the current main as v<version> from tauri.conf.json and creates
# the tag. Approved by the author on 2026-11-16.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # create the release
    defaults:
      run:
        # PowerShell, as in CI: under Git Bash the vendored OpenSSL is
        # configured with Git's Perl, which cannot build it. Steps that are
        # shell scripts say `shell: bash` themselves.
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are made from main only"
              exit 1
            fi
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match the app's version $version (tauri.conf.json)"
            exit 1
          fi
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml
      - name: Release notes exist
        shell: bash
        run: test -s "../../docs/releases/$TAG.md"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # No build cache: a release is built from scratch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install exactly what the lock file lists
        run: npm ci --ignore-scripts
      - name: Licences
        run: npm run licenses
      - name: Known vulnerabilities
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build the installer
        run: npx tauri build --ci
      - name: Checksum
        shell: bash
        run: |
          mkdir -p ../../dist
          cp src-tauri/target/release/bundle/nsis/*.exe ../../dist/
          cd ../../dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the pre-release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Creates the tag on exactly the commit that was built.
            where=(--target "$GITHUB_SHA")
          else
            where=(--verify-tag)
          fi
          gh release create "$TAG" dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "ALTAIS $TAG" \
            --notes-file "docs/releases/$TAG.md" \
            --prerelease \
            "${where[@]}"
