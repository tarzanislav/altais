[package]
name = "altais-storage"
description = "Encrypted local archive for ALTAIS: SQLCipher database, key protection and schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
altais-model = { path = "../altais-model", version = "0.1.0" }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
chrono.workspace = true
getrandom = "0.4.3"
keyring-core = "1.0.1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
altais-interop = { path = "../altais-interop", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[lints]
workspace = true
